#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the .lock.json file run the following command
#
#     bazel run "@base-deps//:lock"
#
# See apt.install rules in MODULE.bazel
version: 1

sources:
  - channel: trixie main contrib
    urls:
      - https://snapshot-cloudflare.debian.org/archive/debian/20251216T083550Z/
      - https://snapshot.debian.org/archive/debian/20251216T083550Z/
  - channel: trixie-security main
    url: https://snapshot-cloudflare.debian.org/archive/debian-security/20251216T083550Z/
  - channel: trixie-updates main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20251216T083550Z/

archs:
  - "amd64"

packages:
  - "ncurses-base"
  - "libncurses6"
  - "tzdata"
  - "coreutils"
  - "dpkg"
  - "apt"
  - "diffutils"
  - "libc-bin"
  - "ca-certificates"
  - "bash"
  - "curl"
  - "busybox"
  - "file"
